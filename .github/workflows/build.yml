name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
          - platform: windows-latest

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Rust ----
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v4

      # ---- Node.js ----
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      # ---- macOS 特定步骤 ----
      - name: Build Tauri app (macOS)
        if: runner.os == 'macOS'
        run: npx tauri build

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-macOS
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-macOS-app
          path: src-tauri/target/release/bundle/macos/*.app

      # ---- Windows 特定步骤 ----
      - name: Fix rc.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          $searchPaths = @(
            "C:\Program Files (x86)\Windows Kits",
            "C:\Program Files\Windows Kits",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Microsoft Visual Studio"
          )

          $allRcExes = @()
          foreach ($p in $searchPaths) {
            if (Test-Path $p) {
              $allRcExes += Get-ChildItem -Path $p -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Found $($allRcExes.Count) rc.exe instances:"

          $sorted = $allRcExes | ForEach-Object {
            $ver = "0.0.0.0"
            if ($_.FullName -match '\\([\d]+\.[\d]+\.[\d]+\.[\d]+)\\') {
              $ver = $Matches[1]
            }
            $arch = "x86"
            if ($_.FullName -match '\\x64\\') { $arch = "x64" }
            elseif ($_.FullName -match '\\arm64\\') { $arch = "arm64" }
            elseif ($_.FullName -match '\\x86\\') { $arch = "x86" }
            [PSCustomObject]@{
              Path    = $_.FullName
              Dir     = $_.Directory.FullName
              Version = $ver
              Arch    = $arch
            }
          } | Sort-Object { [version]$_.Version } -Descending

          foreach ($r in $sorted) {
            Write-Host "  [$($r.Version)] [$($r.Arch)] $($r.Path)"
          }

          $arches = $sorted | Select-Object -Property Arch -Unique

          foreach ($archGroup in $arches) {
            $arch = $archGroup.Arch
            $group = $sorted | Where-Object { $_.Arch -eq $arch }

            if ($group.Count -lt 2) {
              Write-Host "`n[$arch] Only 1 instance, skip"
              continue
            }

            $newest = $group[0]
            Write-Host "`n[$arch] Newest: v$($newest.Version) at $($newest.Dir)"
            Write-Host "[$arch] Replacing $($group.Count - 1) older instances..."

            foreach ($rc in ($group | Select-Object -Skip 1)) {
              if ($rc.Dir -eq $newest.Dir) { continue }
              Write-Host "  -> $($rc.Dir) (v$($rc.Version))"
              foreach ($file in (Get-ChildItem -Path $newest.Dir -File)) {
                $dest = Join-Path $rc.Dir $file.Name
                try {
                  Copy-Item $file.FullName $dest -Force -ErrorAction Stop
                } catch {
                  try {
                    takeown /f $dest /a 2>$null | Out-Null
                    icacls $dest /grant "Administrators:F" 2>$null | Out-Null
                    Copy-Item $file.FullName $dest -Force
                  } catch {
                    Write-Host "    SKIP: $($file.Name)"
                  }
                }
              }
            }
          }

          Write-Host "`nDone."

      - name: Build Tauri app (Windows)
        if: runner.os == 'Windows'
        run: npx tauri build

      - name: Upload Windows MSI
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Windows NSIS
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
