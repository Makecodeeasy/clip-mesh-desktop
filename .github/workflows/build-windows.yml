name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Ensure modern rc.exe
        shell: pwsh
        run: |
          # 问题：embed-resource crate 找到旧版 rc.exe (10.0.10011)，
          # 无法处理标准 ICO 格式（RC2175 错误）。
          # 方案：确保 PATH 中优先使用新版 rc.exe。

          # 列出所有 rc.exe 并按版本号排序
          $sdkBin = "C:\Program Files (x86)\Windows Kits\10\bin"
          $rcExes = Get-ChildItem -Path $sdkBin -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $ver = $_.FullName -replace '.*\\([\d.]+)\\.*','$1'
              [PSCustomObject]@{ Path=$_.Directory.FullName; Version=$ver }
            } | Sort-Object { [version]$_.Version } -Descending

          Write-Host "Found rc.exe versions:"
          $rcExes | ForEach-Object { Write-Host "  $($_.Version) -> $($_.Path)" }

          if ($rcExes.Count -eq 0 -or [version]$rcExes[0].Version -lt [version]"10.0.19041.0") {
            Write-Host "No modern rc.exe found, installing Windows 11 SDK..."
            choco install windows-sdk-11 --no-progress -y
            # 重新扫描
            $rcExes = Get-ChildItem -Path $sdkBin -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue |
              ForEach-Object {
                $ver = $_.FullName -replace '.*\\([\d.]+)\\.*','$1'
                [PSCustomObject]@{ Path=$_.Directory.FullName; Version=$ver }
              } | Sort-Object { [version]$_.Version } -Descending
          }

          if ($rcExes.Count -gt 0) {
            $newest = $rcExes[0]
            Write-Host "`nUsing rc.exe $($newest.Version) from $($newest.Path)"
            # 将新版 rc.exe 目录加到 PATH 最前面
            echo "$($newest.Path)" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            echo "$($newest.Path)\x64" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
