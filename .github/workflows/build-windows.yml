name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix rc.exe (replace ALL old versions with newest)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          # 扫描系统中所有 rc.exe
          $searchPaths = @(
            "C:\Program Files (x86)\Windows Kits",
            "C:\Program Files\Windows Kits",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Microsoft Visual Studio"
          )

          $allRcExes = @()
          foreach ($p in $searchPaths) {
            if (Test-Path $p) {
              $allRcExes += Get-ChildItem -Path $p -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue
            }
          }

          Write-Host "Found $($allRcExes.Count) rc.exe instances:"

          # 提取版本号并排序
          $sorted = $allRcExes | ForEach-Object {
            $ver = "0.0.0.0"
            if ($_.FullName -match '\\([\d]+\.[\d]+\.[\d]+\.[\d]+)\\') {
              $ver = $Matches[1]
            }
            [PSCustomObject]@{
              Path    = $_.FullName
              Dir     = $_.Directory.FullName
              Version = $ver
            }
          } | Sort-Object { [version]$_.Version } -Descending

          foreach ($r in $sorted) {
            Write-Host "  [$($r.Version)] $($r.Path)"
          }

          if ($sorted.Count -eq 0) {
            Write-Host "ERROR: No rc.exe found!"
            exit 1
          }

          $newest = $sorted[0]
          Write-Host "`nNewest: v$($newest.Version) at $($newest.Dir)"

          # 用最新的 rc.exe 替换所有其他版本
          $replaced = 0
          foreach ($rc in ($sorted | Select-Object -Skip 1)) {
            if ($rc.Dir -eq $newest.Dir) { continue }
            Write-Host "`nReplacing in: $($rc.Dir) (v$($rc.Version))"
            foreach ($file in (Get-ChildItem -Path $newest.Dir -File)) {
              $dest = Join-Path $rc.Dir $file.Name
              try {
                Copy-Item $file.FullName $dest -Force -ErrorAction Stop
                Write-Host "  OK: $($file.Name)"
                $replaced++
              } catch {
                try {
                  takeown /f $dest /a 2>$null | Out-Null
                  icacls $dest /grant "Administrators:F" 2>$null | Out-Null
                  Copy-Item $file.FullName $dest -Force
                  Write-Host "  OK (elevated): $($file.Name)"
                  $replaced++
                } catch {
                  Write-Host "  SKIP: $($file.Name) - $($_.Exception.Message)"
                }
              }
            }
          }

          Write-Host "`nReplaced $replaced files across $($sorted.Count - 1) directories"

          # 特别验证 Windows Kits 10.0.10011（embed-resource 用的那个）
          $problemDir = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.10011.0\x86"
          if (Test-Path "$problemDir\rc.exe") {
            Write-Host "`nVerifying $problemDir\rc.exe :"
            $bytes = [System.IO.File]::ReadAllBytes("$problemDir\rc.exe")
            Write-Host "  File size: $($bytes.Length) bytes"
          }

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
