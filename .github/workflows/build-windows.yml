name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v3

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fix rc.exe (embed-resource picks up ancient 10.0.10011 version)
        shell: pwsh
        run: |
          # embed-resource crate 通过 vswhom 找到旧版 rc.exe (10.0.10011)，
          # 该版本无法处理标准 ICO 文件（RC2175 错误）。
          # 策略：找到系统中所有 rc.exe，用最新版物理替换旧版。

          $searchPaths = @(
            "C:\Program Files (x86)\Windows Kits",
            "C:\Program Files\Windows Kits",
            "C:\Program Files (x86)\Microsoft Visual Studio",
            "C:\Program Files\Microsoft Visual Studio"
          )

          $allRcExes = @()
          foreach ($p in $searchPaths) {
            if (Test-Path $p) {
              $found = Get-ChildItem -Path $p -Filter "rc.exe" -Recurse -ErrorAction SilentlyContinue
              $allRcExes += $found
            }
          }

          Write-Host "Found $($allRcExes.Count) rc.exe instances:"
          $sorted = $allRcExes | ForEach-Object {
            $ver = "0.0.0.0"
            if ($_.FullName -match '\\([\d]+\.[\d]+\.[\d]+\.[\d]+)\\') {
              $ver = $Matches[1]
            } elseif ($_.FullName -match '\\([\d]+\.[\d]+\.[\d]+)\\') {
              $ver = "$($Matches[1]).0"
            }
            [PSCustomObject]@{ Path=$_.FullName; Dir=$_.Directory.FullName; Version=$ver }
          } | Sort-Object { [version]$_.Version } -Descending

          foreach ($r in $sorted) {
            Write-Host "  [$($r.Version)] $($r.Path)"
          }

          if ($sorted.Count -lt 2) {
            Write-Host "Only one rc.exe found, no replacement possible"
            exit 0
          }

          $newest = $sorted[0]
          $oldest = $sorted[-1]

          if ([version]$newest.Version -le [version]$oldest.Version) {
            Write-Host "All rc.exe are same version, nothing to do"
            exit 0
          }

          Write-Host "`nReplacing old rc.exe:"
          Write-Host "  From: $($newest.Dir) (v$($newest.Version))"
          Write-Host "  To:   $($oldest.Dir) (v$($oldest.Version))"

          # 替换旧版目录中的所有文件
          foreach ($file in (Get-ChildItem -Path $newest.Dir -File)) {
            $dest = Join-Path $oldest.Dir $file.Name
            try {
              Copy-Item $file.FullName $dest -Force -ErrorAction Stop
              Write-Host "  OK: $($file.Name)"
            } catch {
              takeown /f $dest /a 2>$null | Out-Null
              icacls $dest /grant "Administrators:F" 2>$null | Out-Null
              Copy-Item $file.FullName $dest -Force
              Write-Host "  OK (elevated): $($file.Name)"
            }
          }

          # 验证替换结果
          Write-Host "`nVerification:"
          & "$(Join-Path $oldest.Dir 'rc.exe')" 2>&1 | Select-Object -First 3

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        run: npx tauri build

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: ClipMesh-Windows-NSIS
          path: src-tauri/target/release/bundle/nsis/*.exe
