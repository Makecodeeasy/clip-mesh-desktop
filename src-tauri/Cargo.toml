[package]
name = "clip-mesh-desktop"
version = "1.0.0"
description = "clip-mesh 异构终端数据安全协同系统 — 桌面客户端"
authors = ["Makecodeeasy"]
license = "MIT"
repository = "https://github.com/Makecodeeasy/clip-mesh-desktop"
edition = "2021"
rust-version = "1.75"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
# ---- Tauri 核心框架 ----
tauri = { version = "1.8", features = ["notification-all", "fs-all", "shell-open", "system-tray"] }

# ---- 序列化 ----
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ---- 异步运行时 ----
tokio = { version = "1", features = ["full"] }

# ---- WebSocket 客户端 ----
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tungstenite = "0.24"
futures-util = "0.3"

# ---- 加密 (AES-256-GCM) ----
aes-gcm = "0.10"

# ---- 随机数 ----
rand = "0.8"

# ---- 日志 ----
log = "0.4"
env_logger = "0.11"

# ---- 时间 ----
chrono = "0.4"

# ---- 哈希 (SHA-256) ----
sha2 = "0.10"

# ---- 编解码 ----
base64 = "0.22"
hex = "0.4"

# ---- 配置持久化 ----
dirs = "5.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# ---- 平台特定依赖 ----

[target.'cfg(target_os = "macos")'.dependencies]
# macOS: 通过 objc crate 调用 NSPasteboard
objc = "0.2"
cocoa = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
# Windows: 通过 windows crate 调用 user32 剪贴板 API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemServices",
] }
